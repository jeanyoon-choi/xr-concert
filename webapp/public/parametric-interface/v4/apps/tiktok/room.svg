<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" preserveAspectRatio="xMidYMid slice">
  <!-- Abstract video still: a dark bedroom at night, out of focus. A lamp glows low left, streetlight falls through blinds upper right. No people, no text. -->
  <defs>
    <radialGradient id="lamp" cx="0.18" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#e9a25c" stop-opacity="0.85"/>
      <stop offset="0.25" stop-color="#9a5a2e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#140d0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="0.82" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#7f93b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d1018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" r="0.5"><stop offset="0" stop-color="#f3c58e" stop-opacity="0.5"/><stop offset="0.8" stop-color="#f3c58e" stop-opacity="0.32"/><stop offset="1" stop-color="#f3c58e" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" r="0.5"><stop offset="0" stop-color="#a9bde0" stop-opacity="0.35"/><stop offset="0.8" stop-color="#a9bde0" stop-opacity="0.22"/><stop offset="1" stop-color="#a9bde0" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#050404" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="390" height="760" fill="#0c0b0d"/>
  <rect width="390" height="760" fill="url(#window)"/>
  <g filter="url(#soft)" fill="#9fb2d6" opacity="0.28" transform="rotate(-8 300 160)">
    <rect x="232" y="70" width="170" height="10"/>
    <rect x="232" y="98" width="170" height="10"/>
    <rect x="232" y="126" width="170" height="10"/>
    <rect x="232" y="154" width="170" height="10"/>
    <rect x="232" y="182" width="170" height="10"/>
    <rect x="232" y="210" width="170" height="10"/>
  </g>
  <rect width="390" height="760" fill="url(#lamp)"/>
  <circle cx="58" cy="520" r="34" fill="url(#b1)"/>
  <circle cx="122" cy="575" r="20" fill="url(#b1)"/>
  <circle cx="300" cy="300" r="16" fill="url(#b2)"/>
  <circle cx="336" cy="352" r="26" fill="url(#b2)"/>
  <circle cx="190" cy="430" r="11" fill="url(#b1)"/>
  <rect width="390" height="760" fill="url(#floor)"/>
</svg>
